services:
  db:
    image: postgres:16-alpine
    container_name: erp-db
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp123
    ports:
      - "5432:5432"
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: erp-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: erp_db
      DB_USER: erp
      DB_PASSWORD: erp123
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: erp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  erp_pgdata:
