# Test profile: H2 in PostgreSQL compatibility mode.
# Flyway runs the real migrations (V1, V2) so tests validate actual schema DDL.
spring:
  datasource:
    url: jdbc:h2:mem:erptest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false

logging:
  level:
    com.erp: WARN
    org.hibernate.SQL: WARN
